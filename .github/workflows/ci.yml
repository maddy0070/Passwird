name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A failed security check must block the merge, not warn. Every claim in
# docs/02-threat-model.md section 4 is backed by something that runs here.
permissions:
  contents: read

jobs:
  security-scan:
    name: Static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for embedded secrets and architectural violations
        run: ./scripts/scan-secrets.sh

  static-checks:
    name: Accessibility and dependency checks
    runs-on: ubuntu-latest
    # These run without an Android SDK because they read the sources directly. That is the
    # point: an unresolved import or a token below its contrast floor is caught in seconds,
    # on every push, rather than waiting on the emulator job.
    steps:
      - uses: actions/checkout@v4

      # docs/08-design-system.md section 2.3 commits to 4.5:1 for text and 3:1 for
      # meaningful non-text. This is what makes that a commitment rather than a claim; it
      # parses Color.kt itself, so it cannot drift from the tokens it checks.
      - name: Design token contrast (WCAG 2.1)
        run: python3 scripts/check-contrast.py

      - name: Android module import/dependency consistency
        run: python3 scripts/check-android-deps.py

  core-tests:
    name: Core test suite (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No Android SDK is installed on purpose. The core modules are pure Kotlin/JVM
      # precisely so the security-critical code - crypto, the vault format, the merge
      # algorithm and the rollback defence - runs its full suite in seconds without an
      # emulator. settings.gradle.kts detects the missing SDK and configures only those
      # modules.
      - name: Run core tests
        run: ./gradlew --no-daemon test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Summarise results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, xml.etree.ElementTree as ET
          print("| Module | Tests | Failed |")
          print("|---|---:|---:|")
          total = failed = 0
          for module in sorted(pathlib.Path("core").glob("*")):
              results = module / "build" / "test-results" / "test"
              if not results.exists():
                  continue
              t = f = 0
              for report in results.glob("*.xml"):
                  root = ET.parse(report).getroot()
                  t += int(root.get("tests"))
                  f += int(root.get("failures")) + int(root.get("errors"))
              print(f"| core:{module.name} | {t} | {f} |")
              total += t
              failed += f
          print(f"| **Total** | **{total}** | **{failed}** |")
          PY

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    # The Android modules need an SDK, which the core job deliberately does without.
    # Separated so a Gradle/AGP problem in the app can never mask a failure in the
    # security core, and vice versa.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # `NewApi` is the check that matters most here. Two real crashes on Android 8-10 were
      # found by it on the first run - a Keystore call and an exception type, both added in
      # API 28+ with minSdk 26 - and neither was visible by reading the code.
      - name: Lint
        run: ./gradlew --no-daemon lint

      - name: Assemble release (R8)
        run: ./gradlew --no-daemon assembleRelease

      # scan-secrets.sh reads source; the claim made to users is about the artifact they
      # install. These scan the built APKs: secrets, exported components, backup flags,
      # permissions, TLS-disabling helpers and analytics SDKs.
      - name: Scan the debug APK
        run: python3 scripts/scan-apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Scan the release APK
        run: python3 scripts/scan-apk.py app/build/outputs/apk/release/app-release-unsigned.apk --release

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: passwird-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  verify-ciphertext-only:
    name: Verify nothing but ciphertext leaves the device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Called out as its own job because it is the product's central claim. If this ever
      # fails, the failure should be unmissable in the checks list rather than buried in a
      # test report.
      - name: CiphertextOnlyTest and the sync leak assertions
        run: |
          ./gradlew --no-daemon \
            :core:crypto:test --tests '*CiphertextOnlyTest*' \
            --tests '*RedactedToStringTest*'
          ./gradlew --no-daemon \
            :core:sync:test --tests '*SyncEngineTest*'
          ./gradlew --no-daemon \
            :core:search:test --tests '*SearchIndexLeakTest*'
