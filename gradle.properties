# Passwird build configuration.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Required by every AndroidX dependency in the project.
android.useAndroidX=true

# Jetifier rewrites legacy support-library bytecode. Nothing here needs it, and leaving it
# on would silently permit a dependency that does.
android.enableJetifier=false

kotlin.code.style=official

# R8 full mode. The release build must actually strip logging and unused code; see
# app/proguard-rules.pro.
android.enableR8.fullMode=true

# Non-transitive R classes: a module can only reference its own resources, so a design
# token cannot be reached accidentally from the app module.
android.nonTransitiveRClass=true
